name: Ejecutar Tracker Matutino FEBF

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1-5'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4
      
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Instalar librerías
      run: pip install yfinance requests
        
    - name: Ejecutar el bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: python mercado_bot.py

    - name: Guardar Dashboard Web
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Actualizar web diaria automática"
