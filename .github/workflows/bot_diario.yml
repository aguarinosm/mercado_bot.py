# STREAMING_CHUNK:Configurando los disparadores del bot...
name: Ejecutar Tracker Matutino FEBF

on:
  schedule:
    # Se ejecuta de lunes a viernes (1-5) a las 7:30 AM hora española (5:30 AM UTC)
    - cron: '30 5 * * 1-5'
  
  # Este comando es MÁGICO: Crea un botón en GitHub para que lo puedas ejecutar manualmente cuando quieras
  workflow_dispatch: 

# STREAMING_CHUNK:Definiendo el entorno del servidor...
jobs:
  run-bot:
    runs-on: ubuntu-latest # Usamos un servidor Linux gratuito de GitHub

    steps:
    # 1. El servidor entra en tu repositorio
    - name: Descargar el código
      uses: actions/checkout@v4

    # 2. Prepara Python en el servidor
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

# STREAMING_CHUNK:Instalando dependencias financieras...
    # 3. Instala las herramientas financieras (Yahoo Finance y Requests)
    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install yfinance requests

# STREAMING_CHUNK:Ejecutando el script con las claves secretas...
    # 4. Ejecuta tu código abriendo tu "caja fuerte" para que funcione de forma segura
    - name: Ejecutar el bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: python mercado_bot.py
