# Este comando es MÁGICO: Crea un botón en GitHub para que lo puedas ejecutar manualmente cuando quieras
  workflow_dispatch:

# AÑADIMOS PERMISO PARA QUE EL BOT PUEDA CREAR LA PÁGINA WEB
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest # Usamos un servidor Linux gratuito de GitHub
<!-- ... existing code ... -->
    # 4. Ejecuta tu código abriendo tu "caja fuerte" para que funcione de forma segura
    - name: Ejecutar el bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: python mercado_bot.py

    # 5. Guardar la nueva web en GitHub automáticamente
    - name: Guardar Dashboard Web
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Actualizar web diaria automática"
